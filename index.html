<!DOCTYPE html>
<html>
<head>
    <title>Calendar + Age Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        .container {
            width: 350px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        .days, .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-top: 10px;
        }

        .days div {
            font-weight: bold;
        }

        .dates div {
            padding: 10px;
            margin: 3px;
            background: #eee;
            border-radius: 5px;
        }

        .today {
            background: #4CAF50 !important;
            color: white;
        }

        input {
            margin-top: 10px;
            padding: 8px;
            width: 80%;
        }

        .result {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2> Calendar</h2>

    <div class="header">
        <button onclick="prevMonth()">Previous</button>
        <h3 id="monthYear"></h3>
        <button onclick="nextMonth()">Next</button>
    </div>

    <div class="days">
        <div>Sun</div><div>Mon</div><div>Tue</div>
        <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div class="dates" id="dates"></div>

    <!-- Age Calculator -->
    <h2> Age Calculator</h2>
    <input type="date" id="dob">
    <button onclick="calculateAge()">Calculate Age</button>

    <div class="result" id="ageResult"></div>
</div>

<script>
let date = new Date();

function renderCalendar() {
    let year = date.getFullYear();
    let month = date.getMonth();

    document.getElementById("monthYear").innerText =
        date.toLocaleString("default", { month: "long" }) + " " + year;

    let firstDay = new Date(year, month, 1).getDay();
    let lastDate = new Date(year, month + 1, 0).getDate();

    let datesContainer = document.getElementById("dates");
    datesContainer.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
        datesContainer.innerHTML += "<div></div>";
    }

    for (let i = 1; i <= lastDate; i++) {
        let div = document.createElement("div");
        div.innerText = i;

        let today = new Date();
        if (
            i === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {
            div.classList.add("today");
        }

        datesContainer.appendChild(div);
    }
}

function prevMonth() {
    date.setMonth(date.getMonth() - 1);
    renderCalendar();
}

function nextMonth() {
    date.setMonth(date.getMonth() + 1);
    renderCalendar();
}

// Age Calculator
function calculateAge() {
    let dob = document.getElementById("dob").value;

    if (!dob) {
        alert("Please select your date of birth");
        return;
    }

    let birthDate = new Date(dob);
    let today = new Date();

    let age = today.getFullYear() - birthDate.getFullYear();
    let monthDiff = today.getMonth() - birthDate.getMonth();
    let dayDiff = today.getDate() - birthDate.getDate();

    if (dayDiff < 0) {
        monthDiff--;
        dayDiff += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    }

    if (monthDiff < 0) {
        age--;
        monthDiff += 12;
    }

    document.getElementById("ageResult").innerText =
        `Age: ${age} years, ${monthDiff} months, ${dayDiff} days`;
}

renderCalendar();
</script>

</body>
</html>
